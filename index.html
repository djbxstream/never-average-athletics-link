<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Never Average Athletics</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0c;
      --panel: #121214;
      --line: #2a2a2e;
      --text: #f5f5f5;
      --muted: #8a8a90;
      --accent: #e84d2a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      background: radial-gradient(120% 120% at 50% 0%, #1a1a1c 0%, var(--bg) 60%);
    }
    .card {
      width: 100%;
      max-width: 28rem;
      padding: 2rem 1.5rem;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 1rem;
      box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.5);
    }
    .eyebrow {
      margin: 0 0 0.5rem;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 1rem;
      font-size: clamp(1.5rem, 6vw, 2rem);
      line-height: 1.2;
    }
    .spinner {
      width: 2.5rem;
      height: 2.5rem;
      margin: 1.5rem auto;
      border: 3px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status {
      min-height: 1.5rem;
      margin: 0 0 1.25rem;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .fineprint {
      margin: 1.5rem 0 0;
      color: var(--muted);
      font-size: 0.78rem;
    }
    a.button {
      display: inline-block;
      width: 100%;
      min-height: 2.75rem;
      padding: 0.85rem 1.1rem;
      color: #0a0a0a;
      background: var(--accent);
      border: 0;
      border-radius: 0.6rem;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      text-align: center;
    }
    a.button:hover { background: #ff6b4a; }
    a.button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }
    a.button[hidden] { display: none; }
    .error {
      color: #f0a08a;
      font-weight: 600;
    }
    @media (max-width: 30rem) {
      body { padding: 1rem; }
      .card { padding: 1.5rem 1.1rem; border-radius: 0.85rem; }
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Never Average Athletics</p>
    <h1>Sports Performance Training</h1>

    <div class="spinner" aria-hidden="true"></div>
    <p id="status" role="status" aria-live="polite">Connecting to the training studio…</p>

    <a id="enter-link" class="button" href="#" hidden>Enter Website</a>

    <p class="fineprint">If you are not redirected automatically, click the button above.</p>
  </main>

  <script>
    // Load the current destination URL from public-url.json
    async function loadDestination() {
      const statusEl = document.getElementById('status');
      const linkEl = document.getElementById('enter-link');

      try {
        const response = await fetch('./public-url.json', {
          cache: 'no-store',
          headers: { Accept: 'application/json' }
        });
        if (!response.ok) throw new Error('Unavailable');

        const data = await response.json();
        const url = typeof (data && data.url) === 'string' ? data.url.trim() : '';

        let parsed;
        try {
          parsed = new URL(url);
        } catch (_) {
          throw new Error('Invalid URL');
        }

        // Only allow HTTPS Cloudflare Quick Tunnel URLs for safety
        const validCloudflareTunnel =
          parsed.protocol === 'https:' &&
          /^[a-z0-9-]+\.trycloudflare\.com$/i.test(parsed.hostname) &&
          parsed.pathname === '/' &&
          !parsed.search &&
          !parsed.hash;

        if (!validCloudflareTunnel) throw new Error('Invalid URL');

        statusEl.textContent = 'Ready. Redirecting…';
        linkEl.href = parsed.origin;
        linkEl.hidden = false;

        // Auto-redirect after a brief moment
        setTimeout(() => {
          window.location.assign(parsed.origin);
        }, 800);
      } catch (err) {
        statusEl.textContent = 'The training studio is currently unavailable.';
        statusEl.classList.add('error');
        linkEl.hidden = true;
        console.error('Destination load failed:', err);
      }
    }

    loadDestination();
  </script>
</body>
</html>
